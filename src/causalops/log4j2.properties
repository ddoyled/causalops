# Suppress Spark JVM boot noise for local causalops runs.
# Point at this file via `-Dlog4j2.configurationFile=...` on the driver.
#
# Root MUST stay at WARN — Spark's `Logging.initializeLogging` compares root
# against WARN and, if they differ, prints
#   "Setting default log level to \"WARN\"."
# to stderr and forces WARN. Keeping root at WARN avoids that banner.

status = error
rootLogger.level = warn
rootLogger.appenderRef.stderr.ref = stderr

appender.stderr.type = Console
appender.stderr.name = stderr
appender.stderr.target = SYSTEM_ERR
appender.stderr.layout.type = PatternLayout
appender.stderr.layout.pattern = %d{yy/MM/dd HH:mm:ss} %p %c{1}: %m%n

# Silence the harmless "Unable to load native-hadoop library" warning that
# fires once during SparkContext startup; local Parquet reads don't need it.
logger.native.name = org.apache.hadoop.util.NativeCodeLoader
logger.native.level = error
