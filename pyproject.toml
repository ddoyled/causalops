[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "causalops"
version = "0.1.0"
description = "Registry for causal inference model results on Databricks"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6,<3",
    "click>=8.1,<9",
    "pyspark==3.5.2",
    "delta-spark==3.2.0",
]

[project.scripts]
causalops = "causalops.cli:cli"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-xdist>=3",
    "mypy>=1.10",
    "pre-commit>=4.6.2",
    "ruff>=0.16.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "ignore::DeprecationWarning:pyspark.*",
    "ignore::DeprecationWarning:pkg_resources.*",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # flake8-bugbear
    "UP",       # pyupgrade
    "SIM",      # flake8-simplify
    "C4",       # flake8-comprehensions
]
ignore = [
    "E501",     # line length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
plugins = ["pydantic.mypy"]
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
no_implicit_optional = true
check_untyped_defs = true
